apiVersion: v1
kind: Pod
metadata:
  name: fraud-detection
  namespace: default
  labels:
    app: fraud-detection
spec:
  runtimeClassName: kata-remote
  containers:
    - name: fraud-detection
      image: quay.io/confidential-devhub/signed/fraud-detection:latest
      env:
        - name: DECRYPTION_KEY_PATH
          value: kbs:///default/fraud-dataset/dataset_key
        - name: SAS_TOKEN
          value: kbs:///default/fraud-dataset/sas-token
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1001
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault